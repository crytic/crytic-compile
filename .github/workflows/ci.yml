---
name: CI scripts

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-2025"]
        python: >-
          ${{
            (github.event_name == 'pull_request' && fromJSON('["3.10", "3.14"]'))
            || fromJSON('["3.10", "3.11", "3.12", "3.13", "3.14"]')
          }}
        type:
          - brownie
          - buidler
          - dapp
          - embark
          - hardhat
          - solc
          - truffle
          - waffle
          - foundry
          - standard
          - vyper
          - solc_multi_file
          - hardhat_multi_file
          - hardhat_v3
        include:
          # buidler requires older NodeJS
          - type: buidler
            node-version: 12

          - type: hardhat_v3
            node-version: 22
        exclude:
          # Currently broken, tries to pull git:// which is blocked by GH
          - type: embark
          # Requires nix
          - os: windows-2025
            type: dapp
          # Explore foundry support in windows
          - os: windows-2025
            type: foundry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up shell
        if: runner.os == 'Windows'
        run: |
          printf 'C:\\msys64\\mingw64\\bin\n' >> "$GITHUB_PATH"
          printf 'C:\\msys64\\usr\\bin\n' >> "$GITHUB_PATH"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version || '20' }}
      - name: Set up Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install dependencies
        run: |
          uv pip install .
          solc-select use 0.5.7 --always-install
      - name: Set up nix
        if: matrix.type == 'dapp'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
      - name: Set up cachix
        if: matrix.type == 'dapp'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
        with:
          name: dapp
      - name: Install Foundry
        if: matrix.type == 'foundry'
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09  # v1.9.1
      - name: Run Tests
        env:
          TEST_TYPE: ${{ matrix.type }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          bash "scripts/ci_test_${TEST_TYPE}.sh"
